<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Admin Password — Spelling Star Portal</title>
<style>
body{font-family:Georgia,serif;background:linear-gradient(135deg,#123A72,#0c2c5e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;margin:0}
.card{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.35)}
h1{color:#123A72;font-size:22px;margin:6px 0 4px}
.sub{color:#596579;font-size:14px;margin:0 0 14px}
input{width:100%;padding:12px 14px;border:2px solid #dfe6f2;border-radius:10px;font-size:17px;margin:6px 0;box-sizing:border-box}
button{width:100%;background:#F59E0B;color:#182230;font-weight:800;border:0;border-radius:10px;padding:13px;font-size:17px;margin-top:10px;cursor:pointer}
.msg{min-height:22px;margin:8px 0 0;font-size:14px}
.ok{color:#0a7d2c}.err{color:#b00020}
a{color:#123A72;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:44px">&#128273;</div>
  <h1>Set Admin Password</h1>
  <p class="sub">Teacher-only step. Run this page on the SAME device and browser (or site) as the portal. The password is stored as a one-way hash — it is never saved in plain text.</p>
  <input id="pw1" type="password" placeholder="New admin password (min 6 characters)" autocomplete="new-password">
  <input id="pw2" type="password" placeholder="Repeat the password" autocomplete="new-password">
  <button id="save">Set Password</button>
  <p class="msg" id="msg"></p>
  <p><a href="Spelling_Star_Online_Portal.html">Open the portal</a></p>
</div>
<script>
document.getElementById("save").addEventListener("click",function(){
  var m=document.getElementById("msg");m.className="msg";
  var a=document.getElementById("pw1").value,b=document.getElementById("pw2").value;
  if(a.length<6){m.classList.add("err");m.textContent="Password must be at least 6 characters.";return;}
  if(a!==b){m.classList.add("err");m.textContent="The two passwords do not match.";return;}
  crypto.subtle.digest("SHA-256",new TextEncoder().encode(a)).then(function(d){
    var u=new Uint8Array(d),hx="";
    for(var i=0;i<u.length;i++){hx+=("0"+u[i].toString(16)).slice(-2);}
    try{localStorage.setItem("ssa_admin_hash",hx);}catch(e){m.classList.add("err");m.textContent="Storage blocked on this device.";return;}
    document.getElementById("pw1").value="";document.getElementById("pw2").value="";
    m.classList.add("ok");m.textContent="Admin password set. Use the Teacher door on the portal.";
  });
});
</script>
</body>
</html>
